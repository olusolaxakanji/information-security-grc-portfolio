# ---------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------
title: "Olusola B. Akanji — GRC Portfolio"
description: >-
  Information Security and GRC Professional. AI governance, M&A integration,
  risk programme design, and security policy development across ISO 27001,
  ISO 22301, EU AI Act, NIST CSF 2.0, and GDPR. ServiceNow GRC practitioner.
baseurl: "/information-security-grc-portfolio"
url: "https://olusolaxakanji.github.io"

# ---------------------------------------------------------------
# Theme — Slate gives a dark, professional appearance
# The empty icon-box issue from Minima is resolved by switching themes.
# ---------------------------------------------------------------
remote_theme: pages-themes/slate@v0.2.0
show_downloads: false
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# ---------------------------------------------------------------
# Social links — used in the contact section of index.md
# These are stored here so they have a single source of truth.
# ---------------------------------------------------------------
github_url: "https://github.com/olusolaxakanji"
linkedin_url: "https://www.linkedin.com/in/olusola-b-akanji/"
blog_url: "https://cleanlikesoapblog.wordpress.com/category/grc/"

# ---------------------------------------------------------------
# Navigation — only the homepage appears in the site header
# ---------------------------------------------------------------
header_pages:
  - index.md

# ---------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - "*.sh"

lang: en_GB
